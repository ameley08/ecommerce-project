<!-- main product page-search bar,category filter and sorting -->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WORN | Products</title>

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
               WORN
            </a>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="products.html">Products</a>

                <a href="index.html#about">About</a>

                <a href="index.html#contact">Contact</a>

                <a href="cart.html">
                    Cart (<span id="cart-count">0</span>)
                </a>

            </div>

        </nav>

    </header>


    <!-- ================= PAGE TITLE ================= -->

    <section class="page-header">

        <p class="small-text">SHOP OUR COLLECTION</p>

        <h1>All Products</h1>

        <p>
            Find something you love.
        </p>

    </section>


    <!-- ================= SEARCH AND FILTERS ================= -->

    <section class="filters">

        <!-- Search -->
        <div>

            <label for="search-input">
                Search Products
            </label>

            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
            >

        </div>


        <!-- Category -->
        <div>

            <label for="category-filter">
                Category
            </label>

            <select id="category-filter">

                <option value="all">
                    All Categories
                </option>

            </select>

        </div>


        <!-- Sort -->
        <div>

            <label for="sort-products">
                Sort By
            </label>

            <select id="sort-products">

                <option value="default">
                    Default
                </option>

                <option value="price-low">
                    Price: Low to High
                </option>

                <option value="price-high">
                    Price: High to Low
                </option>

                <option value="name-a">
                    Name: A-Z
                </option>

                <option value="name-z">
                    Name: Z-A
                </option>

            </select>

        </div>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <main class="section">

        <!-- JavaScript will display products here -->
        <div id="products-container" class="product-grid">

            <p>Loading products...</p>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>WORN</h3>

        <p>
            © 2026 WORN. All rights reserved.
        </p>

    </footer>


    <script src="js/main.js"></script>

    <script src="js/products.js"></script>

</body>

</html>
